<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Writing</title>
<script src="./support.js"></script>
<script src="/_blob/8512db353c6b83e8db0655af56c09a80"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F7F6F2}
a{color:#2F6B4F;text-decoration:none}a:hover{color:#22503A;text-decoration:underline}
</style>
</helmet>
<div style="background: {{bg}}; color: #1F1D1A; font-family: -apple-system, system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased">

<header onPointerMove="{{look}}" onPointerLeave="{{unlook}}" style="position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(#E8E3D9 1px, transparent 1px), linear-gradient(90deg, #E8E3D9 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 100%); mask-image: linear-gradient(to bottom, #000 35%, transparent 100%)"></div>
<div style="position: relative; max-width: 1120px; margin: 0 auto; padding: 40px 24px 4px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<h1 style="margin: 0 0 28px; font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: clamp(40px, 5.5vw, 56px); line-height: 1.05; font-weight: 400; letter-spacing: -0.045em">[Blog Name]</h1>
<button type="button" id="frog" onClick="{{hop}}" onPointerEnter="{{hop}}" aria-label="Say hello to the frog in the suit" style="flex: none; width: 224px; height: 224px; margin: 0; padding: 0; border: none; background: none; cursor: pointer">
<canvas id="frog3d" width="112" height="112" aria-hidden="true" style="display: block; width: 224px; height: 224px; image-rendering: pixelated"></canvas>
</button>
</div>
</header>

<div style="max-width: 1120px; margin: 0 auto; padding: 8px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px 80px; align-items: flex-start">

<main style="flex: 999 1 560px; min-width: 0; max-width: 700px; display: flex; flex-direction: column">
<div role="group" aria-label="Categories" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; border-bottom: 1px solid #E4DFD5">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="display: flex; align-items: baseline; gap: 5px; min-height: 44px; margin: 0 0 -1px; padding: 12px 0 0; box-sizing: border-box; border: none; border-bottom: 1.5px solid {{c.line}}; background: none; color: {{c.color}}; font-family: inherit; font-size: 15px; cursor: pointer">
<span>{{c.label}}</span>
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: {{c.countColor}}">{{c.count}}</span>
</button>
</sc-for>
</div>

<sc-for list="{{posts}}" as="post" hint-placeholder-count="4">
<article style="padding: 28px 0; border-bottom: 1px solid #E4DFD5; display: flex; align-items: center; gap: 32px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #6B665C">
<span style="color: {{post.accent}}">{{post.tag}}</span>
<span>{{post.date}}</span>
</div>
<h3 style="margin: 0; font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: 25px; line-height: 1.25; font-weight: 400; letter-spacing: -0.02em; text-wrap: balance"><a href="{{post.href}}" style="color: #1F1D1A">{{post.title}}</a></h3>
<p style="margin: 0; font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: 17px; line-height: 1.6; color: #5C5850; text-wrap: pretty">{{post.excerpt}}</p>
</div>
<sc-if value="{{post.hasThumb}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="flex: none; width: clamp(80px, 24%, 160px); aspect-ratio: 10 / 7; border-radius: 10px; background: #ECE8DF; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: #6B665C">[thumbnail]</div>
</sc-if>
</article>
</sc-for>
</main>

<aside aria-label="About" style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 40px; padding-top: 4px">
<div style="display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="width: 96px; height: 96px; border-radius: 48px; background: #E6E1D8"></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: 24px; font-weight: 400; letter-spacing: -0.02em">Ryan Kim</span>
<p style="margin: 0; font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif; font-size: 16px; line-height: 1.6; color: #5C5850; text-wrap: pretty">[One or two lines on what you work on and what you write about.]</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px">
<a href="#">GitHub</a>
<a href="#">LinkedIn</a>
<a href="#">Email</a>
</div>
</div>

<div style="display: flex; flex-direction: column">
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B665C; padding-bottom: 4px">Experience</span>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4DFD5">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">[Role]</span>
<span style="font-size: 14px; color: #5C5850">[Company]</span>
</div>
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #6B665C; white-space: nowrap">[2024–now]</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4DFD5">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">[Role]</span>
<span style="font-size: 14px; color: #5C5850">[Company]</span>
</div>
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #6B665C; white-space: nowrap">[2022–24]</span>
</div>
</div>

<div style="display: flex; flex-direction: column">
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B665C; padding-bottom: 4px">Education</span>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4DFD5">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">[Degree]</span>
<span style="font-size: 14px; color: #5C5850">[School]</span>
</div>
<span style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: #6B665C; white-space: nowrap">[2022]</span>
</div>
</div>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6B4F","options":["#2F6B4F","#8B2F2F","#1F1D1A"]},"bg":{"editor":"color","default":"#F7F6F2","options":["#F7F6F2","#F5F6F8","#FFFFFF"]},"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.lookAt = { x: 0, y: 0 };

    var tries = 0;

      if (!window.THREE) {
        tries += 1;

    };
    start();
  }
  componentWillUnmount() {
    this.running = false;

    if (this.renderer) { this.renderer.dispose(); }
  }
  makeAgent(T) {
    var PI = Math.PI;

    var skin = mat(0x6fb85e), suit = mat(0x2e2d2b), suitDark = mat(0x1c1b1a), shirt = mat(0xf6f3ec);
    var ink = mat(0x1c1b22), tie = mat(0x2f6b4f), shoe = mat(0x141418), mouthM = mat(0x2c3a2a);
    var leather = mat(0x5a3a22), brass = mat(0xc9a24a), frameM = mat(0x0f0f13);
    var lensM = new T.MeshLambertMaterial({ color: 0x22201d, transparent: true, opacity: 0.3, flatShading: true, side: T.DoubleSide });
    var root = new T.Group(), frog = new T.Group();
    root.add(frog);
    root.rotation.y = -0.6;
    var add = function (geo, m, x, y, z, parent) {
      var mesh = new T.Mesh(geo, m);
      mesh.position.set(x, y, z);
      (parent || frog).add(mesh);
      return mesh;
    };
    var shadow = new T.Mesh(new T.CircleGeometry(0.75, 12), new T.MeshBasicMaterial({ color: 0x2a2622, transparent: true, opacity: 0.14 }));
    shadow.rotation.x = -PI / 2;
    shadow.position.y = 0.01;
    root.add(shadow);

    var R = 0.56, bRx = R * 0.9, bRy = R * 1.05, bRz = R * 0.8;
    var legLen = 0.4, hipY = legLen + 0.05, bodyY = hipY + bRy - 0.12;
    var sRx = 0.66 * 1.2, sRy = 0.66 * 0.72, sRz = 0.66;
    var headY = bodyY + bRy + sRy * 0.35;

    var leg = function (side) {
      var hip = new T.Group();
      hip.position.set(bRx * 0.48 * side, hipY, 0);
      frog.add(hip);
      add(new T.CylinderGeometry(0.13, 0.12, legLen, 6), suit, 0, -legLen / 2, 0, hip);
      add(new T.BoxGeometry(0.26, 0.1, 0.46), shoe, 0, -legLen, 0.1, hip);
      return hip;
    };
    var legL = leg(-1), legR = leg(1);

    var body = add(new T.IcosahedronGeometry(R, 1), suit, 0, bodyY, 0);
    body.scale.set(0.9, 1.05, 0.8);
    var chestY = bodyY + bRy * 0.32, shirtZ = bRz * 0.93;
    var flatShirt = new T.MeshBasicMaterial({ color: 0xf3efe6, side: T.DoubleSide });
    add(new T.PlaneGeometry(0.2, 0.36), flatShirt, 0, chestY + 0.02, shirtZ + 0.01);
    [-1, 1].forEach(function (s) {

      col.rotation.z = -0.35 * s;
    });
    add(new T.BoxGeometry(0.08, 0.3, 0.03), tie, 0, chestY - 0.01, shirtZ + 0.04);
    add(new T.BoxGeometry(0.1, 0.07, 0.04), tie, 0, chestY + 0.16, shirtZ + 0.045);
    add(new T.SphereGeometry(0.025, 5, 4), suitDark, 0, chestY - 0.3, bRz * 0.99);
    add(new T.SphereGeometry(0.025, 5, 4), suitDark, 0, chestY - 0.42, bRz * 0.97);
    add(new T.BoxGeometry(0.1, 0.05, 0.03), tie, -0.24, chestY - 0.05, bRz * 0.88);

    var shY = bodyY + bRy * 0.42, shX = bRx * 0.95;
    var arm = function (side) {
      var sh = new T.Group();
      sh.position.set(shX * side, shY, 0.03);
      frog.add(sh);
      add(new T.CylinderGeometry(0.09, 0.11, 0.44, 6), suit, 0, -0.22, 0, sh);
      add(new T.CylinderGeometry(0.1, 0.1, 0.05, 6), shirt, 0, -0.46, 0, sh);
      add(new T.IcosahedronGeometry(0.11, 0), skin, 0, -0.53, 0, sh);
      sh.rotation.z = 0.12 * side;
      return sh;
    };
    var armL = arm(-1), armR = arm(1);
    var bag = new T.Group();
    bag.position.set(0, -0.6, 0.02);
    bag.rotation.y = PI / 2;
    armR.add(bag);
    add(new T.BoxGeometry(0.5, 0.36, 0.13), leather, 0, -0.2, 0, bag);
    add(new T.TorusGeometry(0.07, 0.02, 3, 8, PI), suitDark, 0, -0.01, 0, bag);
    [-1, 1].forEach(function (s) { add(new T.BoxGeometry(0.05, 0.04, 0.02), brass, 0.12 * s, -0.06, 0.075, bag); });

    var head = new T.Group();
    head.position.set(0, headY, 0);
    frog.add(head);
    var skull = add(new T.SphereGeometry(0.66, 10, 7), skin, 0, 0, 0, head);
    skull.scale.set(1.2, 0.72, 1);
    var ey = sRy * 0.7, ez = sRz * 0.3, r = 0.22, sp = 0.36;
    [-1, 1].forEach(function (s) {
      add(new T.SphereGeometry(r + 0.07, 8, 6), skin, sp * s, ey - 0.02, ez - 0.04, head);
      add(new T.SphereGeometry(r, 9, 7), shirt, sp * s, ey, ez + 0.06, head);
      add(new T.SphereGeometry(0.07, 6, 5), ink, sp * s, ey + 0.08, ez + 0.06 + Math.sqrt(r * r - 0.0064) - 0.03, head);
    });
    var mouth = add(new T.TorusGeometry(0.12, 0.03, 3, 8, PI), mouthM, 0, -0.14, sRz * 0.95, head);
    mouth.rotation.z = PI;
    mouth.rotation.x = 0.3;

    var gy = 0.23;
    var glasses = new T.Group();
    glasses.position.set(0, gy, 0.64);
    head.add(glasses);
    var gx = 0.3, W = 0.3, H = 0.22;
    [-1, 1].forEach(function (s) {
      var cx = gx * s;
      add(new T.BoxGeometry(W + 0.05, 0.07, 0.06), frameM, cx, H / 2, 0, glasses);
      add(new T.BoxGeometry(W, 0.045, 0.05), frameM, cx, -H / 2, 0, glasses);
      add(new T.BoxGeometry(0.05, H, 0.05), frameM, cx - W / 2, 0, 0, glasses);
      add(new T.BoxGeometry(0.05, H, 0.05), frameM, cx + W / 2, 0, 0, glasses);
      add(new T.PlaneGeometry(W - 0.04, H - 0.04), lensM, cx, 0, -0.01, glasses);
      var ox = gx + W / 2 + 0.02, tx = sRx * 0.92, tz = -0.62;
      var len = Math.sqrt((tx - ox) * (tx - ox) + tz * tz);
      var temple = add(new T.BoxGeometry(0.045, 0.045, len), frameM, s * (ox + tx) / 2, H / 2 - 0.02, tz / 2, glasses);
      temple.rotation.y = Math.atan2(s * (tx - ox), tz);
    });
    add(new T.BoxGeometry(2 * (gx - W / 2), 0.05, 0.05), frameM, 0, H / 2 - 0.03, 0, glasses);

    return { root: root, frog: frog, legL: legL, legR: legR, armL: armL, armR: armR, head: head, shadow: shadow, glasses: glasses, gy: gy };
  }
  poseAgent(f, t, actT, look) {
    f.head.rotation.y = look.x * 0.5;
    f.head.rotation.x = look.y * 0.2;
    if (actT >= 0 && actT < 0.8) {
      var p = Math.sin((actT / 0.8) * Math.PI);
      f.frog.position.y = p * 0.45;
      f.frog.rotation.z = 0;
      f.frog.rotation.x = 0;
      f.head.rotation.z = 0;
      f.root.rotation.y = -0.6 * (1 - p);
      f.legL.rotation.x = -0.5 * p;
      f.legR.rotation.x = -0.5 * p;
      f.armL.rotation.x = 0;
      f.armL.rotation.z = -(0.12 + p * 2.3);
      f.armR.rotation.x = 0;
      f.glasses.position.y = f.gy;
    } else {
      var ph = t * Math.PI * 2 / 0.9;
      var sw = Math.sin(ph);
      f.frog.position.y = Math.abs(Math.cos(ph)) * 0.05;
      f.frog.rotation.z = sw * 0.05;
      f.frog.rotation.x = 0;
      f.head.rotation.z = -sw * 0.04;
      f.root.rotation.y = -0.6;
      f.legL.rotation.x = sw * 0.5;
      f.legR.rotation.x = -sw * 0.5;
      f.armL.rotation.x = -sw * 0.45;
      f.armL.rotation.z = -0.12;
      f.armR.rotation.x = sw * 0.2;
      f.glasses.position.y = f.gy;
    }
    f.shadow.scale.setScalar(1 - f.frog.position.y * 0.6);
  }
  setupScene(T) {
    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(0, 1.75, 6.5);
    camera.lookAt(0, 1.45, 0);
    scene.add(new T.AmbientLight(0xffffff, 0.55));
    var sun = new T.DirectionalLight(0xffffff, 0.85);
    sun.position.set(-2.5, 4, 3.5);
    scene.add(sun);
    return { scene: scene, camera: camera };
  }
  buildFrog() {
    var self = this, T = window.THREE;
    var canvas = document.getElementById('frog3d');
    if (!canvas) { return; }
    var renderer;
    try { renderer = new T.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true }); } catch (e) { return; }

    renderer.setPixelRatio(1);
    renderer.setSize(112, 112, false);
    var sc = this.setupScene(T);
    var f = this.makeAgent(T);
    sc.scene.add(f.root);
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduce = false; }

      renderer.render(sc.scene, sc.camera);
    };
    if (reduce) { draw(0.225); return; }
    var last = -1;
    this.running = true;
    var tick = function (now) {
      if (!self.running) { return; }
      var t = now / 1000;
      if (t - last >= 1 / 12) { last = t; draw(t); }
      self.raf = window.requestAnimationFrame(tick);
    };
    this.raf = window.requestAnimationFrame(tick);
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#2F6B4F';
    var cat = (this.state && this.state.cat) || 'all';
    var all = [
      { tag: 'Statistics', date: 'Oct 2026', title: 'Your A/B test needs more users than you think', excerpt: 'A one-line rule for sample size, and why halving the effect quadruples the cost.', readTime: '6 min read', isNotebook: false, hasThumb: true },
      { tag: 'Machine learning', date: 'Sep 2026', title: 'Calibration plots, explained with one model', excerpt: 'Accuracy says how often a model is right. A calibration plot says whether to trust its probabilities.', readTime: '8 min read', isNotebook: true, hasThumb: true },
      { tag: 'Statistics', date: 'Aug 2026', title: 'Bootstrap confidence intervals in 30 lines', excerpt: 'Resample your own data to get an interval, step by step, with no formulas to memorize.', readTime: '5 min read', isNotebook: true, hasThumb: true },
      { tag: 'Essay', date: 'Jul 2026', title: 'Why I write things down', excerpt: 'Writing is how I find out what I don’t understand yet.', readTime: '4 min read', isNotebook: false, hasThumb: false }
    ];
    var defs = [
      { id: 'all', label: 'All posts' },
      { id: 'Statistics', label: 'Statistics' },
      { id: 'Machine learning', label: 'Machine learning' },
      { id: 'Essay', label: 'Essays' }
    ];
    var cats = defs.map(function (c) {
      var on = c.id === cat;
      var n = all.filter(function (p) { return c.id === 'all' || p.tag === c.id; }).length;
      return {
        label: c.label,
        count: String(n),
        pressed: on ? 'true' : 'false',
        color: on ? accent : '#6B665C',
        line: on ? accent : 'transparent',
        countColor: on ? accent : '#6B665C',
        pick: function () { self.setState({ cat: c.id }); }
      };
    });
    var posts = all
      .filter(function (p) { return cat === 'all' || p.tag === cat; })
      .map(function (p) { return Object.assign({}, p, { accent: accent, href: 'Main.dc.html' }); });
    var current = defs.filter(function (c) { return c.id === cat; })[0];
    return {
      bg: this.props.bg ?? '#F7F6F2',
      cats: cats,
      posts: posts,
      catLabel: current ? current.label : 'All posts',
      postCount: posts.length + (posts.length === 1 ? ' post' : ' posts'),
      hop: function () {
        var t = performance.now() / 1000;
        if (t - self.hopAt > 0.8) { self.hopAt = t; }
      },
      look: function (e) {
        var el = document.getElementById('frog');
        if (!el) { return; }
        var r = el.getBoundingClientRect();
        var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * 0.3);
        self.lookAt = { x: Math.max(-1, Math.min(1, dx / 400)), y: Math.max(-1, Math.min(1, dy / 300)) };
      },
      unlook: function () { self.lookAt = { x: 0, y: 0 }; }
    };
  }
}
</script>
